<!DOCTYPE html>
<!--
  Root 404 handler for the versioned ossum.tech site.

  Before versioning, every page lived at an unversioned path such as
  /riddl/concepts/entity.html. After the move to `mike` those pages live under
  a version prefix (/latest/riddl/concepts/entity.html), so every inbound link
  and search result pointing at the old shape would otherwise 404. This file
  rewrites them to the default version instead.

  It lives at the ROOT of the gh-pages branch. mike manages only the version
  directories, versions.json, and the root index.html, so a file placed here
  survives every subsequent deploy. It is NOT built by mkdocs -- copy it into
  place as part of the gh-pages migration (see migrate-gh-pages-to-mike.md).

  The redirect is whitelist-driven: only a first path segment that was a
  top-level section of the old flat site is rewritten. Anything else -- an
  unknown path, or a genuine 404 inside a version -- falls through to the
  message below, so there is no way to construct a redirect loop.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found &mdash; ossum.tech</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: "Encode Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 34rem; margin: 6rem auto; padding: 0 1.5rem; line-height: 1.6;
    }
    h1 { font-size: 1.5rem; }
    a { color: #0da19e; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e2129; color: #e6e6e6; }
      a { color: #19c4bf; }
    }
  </style>
  <script>
    (function () {
      // Top-level sections of the pre-versioning site. A path starting with
      // one of these is a legacy link and gets the default version prefix.
      var LEGACY_SECTIONS = [
        "riddl", "synapify", "MCP", "OSS", "about", "coming-soon",
        "assets", "stylesheets", "javascripts", "search"
      ];
      var DEFAULT_VERSION = "latest";

      var path = window.location.pathname.replace(/^\/+/, "");
      var first = path.split("/")[0];

      if (LEGACY_SECTIONS.indexOf(first) !== -1) {
        window.location.replace(
          "/" + DEFAULT_VERSION + "/" + path +
          window.location.search + window.location.hash
        );
      }
    })();
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>
    The documentation is now versioned, so pages live under a version prefix
    such as <code>/latest/</code>.
  </p>
  <p><a href="/">Go to the documentation home page</a></p>
</body>
</html>
