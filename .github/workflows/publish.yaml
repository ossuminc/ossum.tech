name: publishing
on:
  push:
    branches:
      # Each publishing branch declares the version it deploys as in
      # docs-version.yml. release/2 is deliberately absent: work in progress
      # must not refresh the production site.
      - main        # RIDDL 2.0 documentation
      - docs/1.x    # RIDDL 1.x maintenance line
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mike commits into the gh-pages branch, so its history must be
          # present locally. The default shallow checkout does not fetch it.
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Read the documentation version for this branch
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import yaml
          cfg = yaml.safe_load(open("docs-version.yml"))
          print(f"DOCS_VERSION={cfg['version']}")
          print(f"DOCS_ALIASES={' '.join(cfg.get('aliases') or [])}")
          PY
      - name: Deploy with mike
        run: |
          echo "Publishing version $DOCS_VERSION with aliases: $DOCS_ALIASES"
          mike deploy --push --update-aliases "$DOCS_VERSION" $DOCS_ALIASES
