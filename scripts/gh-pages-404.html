<!DOCTYPE html>
<!--
  Root 404 handler for ossum.tech.

  The site has had three URL shapes. This file forwards the first two to the
  third so old links and search results keep working:

    1. pre-versioning     /riddl/concepts/entity.html
    2. site-wide versions /latest/riddl/concepts/entity.html
    3. per-product (now)  /riddl/latest/concepts/entity/

  Shape 3 moved the product into the FIRST path segment and the version into
  the second, dropped the .html suffix (the `offline` plugin, which forced
  use_directory_urls: false, has been removed), and split the single site into
  an unversioned shell plus one versioned sub-site per product.

  It lives at the ROOT of the gh-pages branch. mike manages only the version
  directories under each prefix and their versions.json; the shell deploy
  copies this file in last, after the shell build has emitted its own 404.html.

  The rewrite is whitelist-driven: only a first path segment that was a
  top-level section of an older site is rewritten. Anything else -- including a
  genuine 404 inside a current sub-site -- falls through to the message below.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found &mdash; ossum.tech</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: "Encode Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 34rem; margin: 6rem auto; padding: 0 1.5rem; line-height: 1.6;
    }
    h1 { font-size: 1.5rem; }
    a { color: #0da19e; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e2129; color: #e6e6e6; }
      a { color: #19c4bf; }
    }
  </style>
  <script>
    (function () {
      var PREFIXES = ["riddl", "riddlg", "synapify"];
      var VERSION = /^(latest|next|\d+(\.\d+)*)$/;

      var path = window.location.pathname.replace(/^\/+/, "");
      var segs = path.split("/").filter(Boolean);
      if (!segs.length) return;

      // The IDE docs left the versioned riddl site and split two ways: three
      // tool pages became the unversioned /ide-help/, while authoring-riddl --
      // a language style guide, not tool documentation -- stayed versioned and
      // moved under the RIDDL author guides. So the mapping is per FILENAME,
      // not per directory.
      function fromOSS(tail) {
        tail = tail.replace(/index\.html$/, "").replace(/\.html$/, "/");
        if (tail && !/\/$/.test(tail)) tail += "/";
        if (/^authoring-riddl(\/|$)/.test(tail)) {
          return "/riddl/latest/guides/authors/authoring-riddl/";
        }
        return "/ide-help/" + tail;
      }

      // /riddl/<version>/OSS/... was live only briefly, between the split and
      // this reorganisation, but it was live -- and the loop guard below would
      // otherwise swallow it. Handled before the guard for that reason.
      var versionedOSS = path.match(/^riddl\/[^/]+\/OSS\/(.*)$/);
      if (versionedOSS) {
        window.location.replace(
          fromOSS(versionedOSS[1]) + window.location.search + window.location.hash
        );
        return;
      }

      // GUARD AGAINST A REWRITE LOOP. "riddl" is both a current prefix and a
      // former top-level section, so a real 404 inside /riddl/latest/ would
      // otherwise be rewritten to /riddl/latest/latest/... Leave anything that
      // already has the current shape alone.
      if (PREFIXES.indexOf(segs[0]) !== -1 && VERSION.test(segs[1] || "")) return;

      // Shape 2 put the version first. Shape 1 had no version at all.
      var version = "latest";
      if (VERSION.test(segs[0])) {
        version = segs.shift();
      }
      if (!segs.length) { window.location.replace("/"); return; }

      var rest = segs.join("/");
      var prefix = null;

      if (rest.indexOf("riddl/tools/riddlg/") === 0) {
        // riddlg was promoted out of the RIDDL tools section.
        prefix = "riddlg";
        rest = rest.slice("riddl/tools/riddlg/".length);
      } else if (rest === "MCP" || rest.indexOf("MCP/") === 0) {
        // The MCP client guides travel with riddlg.
        prefix = "riddlg";
      } else if (rest.indexOf("riddl/OSS/") === 0) {
        // Shape 2 nested it under riddl/. Must be tested BEFORE the generic
        // "riddl/" branch below, which would otherwise claim it and produce
        // /riddl/<version>/OSS/... -- a path that no longer exists.
        window.location.replace(
          fromOSS(rest.slice("riddl/OSS/".length)) +
          window.location.search + window.location.hash
        );
        return;
      } else if (rest === "OSS" || rest.indexOf("OSS/") === 0) {
        window.location.replace(
          fromOSS(rest === "OSS" ? "" : rest.slice("OSS/".length)) +
          window.location.search + window.location.hash
        );
        return;
      } else if (rest === "riddl" || rest.indexOf("riddl/") === 0) {
        prefix = "riddl";
        rest = rest === "riddl" ? "" : rest.slice("riddl/".length);
      } else if (rest === "synapify" || rest.indexOf("synapify/") === 0) {
        prefix = "synapify";
        rest = rest === "synapify" ? "" : rest.slice("synapify/".length);
      } else if (/^(about|assets|stylesheets|javascripts|search)(\/|$)/.test(rest)) {
        // The unversioned shell. No prefix and no version segment.
        //
        // `coming-soon` is deliberately NOT in this list. That page was deleted,
        // so mapping it would send /coming-soon/ to /coming-soon/ -- the same
        // URL -- and window.location.replace would reload forever. It falls
        // through to the not-found message instead, which is the honest answer:
        // the page is gone, not moved.
        prefix = "";
      } else if (rest === "index.html") {
        window.location.replace("/");
        return;
      } else {
        return;  // unknown -- show the message rather than guess
      }

      // A version token from shape 2 was always RIDDL's. It means nothing to
      // riddlg or Synapify, which have their own numbering, so those go to
      // their own default rather than to a version that does not exist.
      if (prefix !== "riddl") version = "latest";

      rest = rest.replace(/index\.html$/, "").replace(/\.html$/, "/");
      if (rest && !/\/$/.test(rest) && !/\.[a-z0-9]+$/i.test(rest)) rest += "/";

      var target = prefix ? "/" + prefix + "/" + version + "/" + rest : "/" + rest;
      window.location.replace(
        target.replace(/\/{2,}/g, "/") +
        window.location.search + window.location.hash
      );
    })();
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>
    The documentation is versioned per product, so pages live under a product
    and version prefix such as <code>/riddl/latest/</code>.
  </p>
  <p><a href="/">Go to the documentation home page</a></p>
</body>
</html>
