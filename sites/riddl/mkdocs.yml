# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
INHERIT: ../common.yml

site_name: RIDDL Documentation
# Overridden per deploy by DOCS_SITE_URL (scripts/site_url_hook.py) so each
# version's sitemap advertises its own URLs. This value is the local default.
site_url: https://ossum.tech/riddl/latest/
edit_uri: edit/main/sites/riddl/docs/

extra:
  # One mike version per RIDDL MINOR version. Material resolves the selector
  # relatively -- `new URL("../versions.json", base)` -- so a page at
  # /riddl/2.0/ finds /riddl/versions.json with no configuration here.
  version:
    provider: mike
    alias: true
  # Shown only when this build is not the `latest` alias. Worded per branch,
  # because each branch is its own build: this one documents RIDDL 2.0, which
  # is unreleased, so it announces a preview. docs/1.x says the opposite --
  # that a newer release exists. When 2.0 becomes `latest` this stops showing
  # on its own.
  outdated_banner: >-
    This is a preview of the RIDDL 2.0 documentation. RIDDL 2.0 has not been
    released yet.

